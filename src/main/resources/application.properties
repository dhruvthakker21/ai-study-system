spring.application.name=ai-study-system
server.port=${PORT:8080}

# Database connection (override with env vars on Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_study_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway (disable for now until entities are stable)
spring.flyway.enabled=false

youtube.api.key=${youtube_api_key}
spring.devtools.add-properties=false

ai.service.url=${AI_SERVICE_URL:http://localhost:5000}
spring.codec.max-in-memory-size=10MB
groq.api.key=${groq_api}
spring.mvc.pathmatch.matching-strategy=ant_path_matcher